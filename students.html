<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Examination Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">E</div>
            <div>
                <h2>Exam System</h2>
                <span>Teacher Panel</span>
            </div>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="students.html">Students</a>
            <a href="exams.html">Exams</a>
            <a href="settings.html">Institute Settings</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </aside>

    <main class="main">

        <header class="topbar">
            <div>
                <h1>Students</h1>
                <p>Manage student records</p>
            </div>

            <button class="btn-primary" id="addStudentBtn">
                + Add Student
            </button>
        </header>

        <section class="card">

            <div class="toolbar">
                <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search by name, roll or registration..."
                >

                <select id="departmentFilter">
                    <option value="">All Departments</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                </select>

                <select id="sectionFilter">
                    <option value="">All Sections</option>
                    <option value="A">Section A</option>
                    <option value="B">Section B</option>
                    <option value="C">Section C</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Roll</th>
                            <th>Registration</th>
                            <th>Department</th>
                            <th>Semester</th>
                            <th>Section</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentsTable">
                        <tr>
                            <td colspan="8" class="empty">
                                Loading students...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>
</div>


<!-- STUDENT MODAL -->

<div class="modal" id="studentModal">

    <div class="modal-box">

        <div class="modal-header">
            <div>
                <h2 id="modalTitle">Add Student</h2>
                <p>Enter complete student information</p>
            </div>

            <button class="close-btn" id="closeStudentModal">
                ×
            </button>
        </div>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student Name *</label>
                    <input type="text" id="studentName" required>
                </div>

                <div class="form-group">
                    <label>Roll Number *</label>
                    <input type="text" id="rollNumber" required>
                </div>

                <div class="form-group">
                    <label>Registration Number</label>
                    <input type="text" id="registrationNumber">
                </div>

                <div class="form-group">
                    <label>Date of Birth *</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label>Department *</label>
                    <input type="text" id="department" required>
                </div>

                <div class="form-group">
                    <label>Class / Course *</label>
                    <input type="text" id="course" required>
                </div>

                <div class="form-group">
                    <label>Semester / Year</label>
                    <input type="text" id="semester">
                </div>

                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section">
                </div>

                <div class="form-group">
                    <label>Academic Session</label>
                    <input type="text" id="session" placeholder="2026-27">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="phone">
                </div>

                <div class="form-group full">
                    <label>Student Image URL</label>
                    <input
                        type="url"
                        id="imageUrl"
                        placeholder="https://..."
                    >
                </div>

                <div class="form-group full">
                    <label>Additional Information</label>
                    <textarea id="moreInfo" rows="4"></textarea>
                </div>

            </div>

            <div id="studentMessage" class="message"></div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="cancelStudent">
                    Cancel
                </button>

                <button type="submit" class="btn-primary">
                    Save Student
                </button>
            </div>

        </form>

    </div>

</div>

<script type="module" src="js/students.js"></script>

</body>
</html>
