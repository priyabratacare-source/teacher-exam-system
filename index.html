<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Student Exam System</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="brand-icon">
                🎓
            </div>

            <h1>Student Exam System</h1>

            <p class="login-subtitle">
                Teacher Administration Portal
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter teacher email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn">

                    Login to Dashboard

                </button>

                <div id="loginMessage"
                     class="message">
                </div>

            </form>

        </div>

    </div>

    <script type="module"
            src="js/auth.js">
    </script>

</body>

</html>
